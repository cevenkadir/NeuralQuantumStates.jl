name: CI (ConnectedBasisConfigurations)
on:
  push:
    branches:
      - main
    tags: ['*']
    paths:
      - 'lib/ConnectedBasisConfigurations/**'
      - '.github/workflows/CI-ConnectedBasisConfigurations.yml'
      - '.github/workflows/ci-package.yml'
  pull_request:
    paths:
      - 'lib/ConnectedBasisConfigurations/**'
      - '.github/workflows/CI-ConnectedBasisConfigurations.yml'
      - '.github/workflows/ci-package.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  # A called workflow cannot hold more permission than its caller, so these have to be granted
  # here as well as in `ci-package.yml`.
  actions: write
  contents: read
jobs:
  # The job id prefixes every check this workflow reports --
  # `ConnectedBasisConfigurations / Julia ...` -- which is what keeps the seven workflows'
  # checks distinguishable from each other.
  ConnectedBasisConfigurations:
    uses: ./.github/workflows/ci-package.yml
    with:
      project: lib/ConnectedBasisConfigurations
      coverage-directories: lib/ConnectedBasisConfigurations/src
      flags: ConnectedBasisConfigurations
    secrets: inherit
