name: CI (NeuralQuantumStates)
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  # A called workflow cannot hold more permission than its caller, so these have to be granted
  # here as well as in `ci-package.yml`.
  actions: write
  contents: read
jobs:
  # The job id prefixes every check this workflow reports -- `NeuralQuantumStates / Julia ...` --
  # which is what keeps the seven workflows' checks distinguishable from each other.
  NeuralQuantumStates:
    # Unlike the lib/* packages this one has no path filter: the umbrella exercises the whole
    # stack together, so any change to the repository is a reason to run it.
    uses: ./.github/workflows/ci-package.yml
    with:
      project: .
      coverage-directories: src
      flags: NeuralQuantumStates
    secrets: inherit
