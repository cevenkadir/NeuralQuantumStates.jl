name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          # 1.11 is the compat floor declared by every package in this repo; the `[sources]`
          # entries that resolve the lib/* packages also require it.
          - '1.11'
          - '1.12'
          - '1'
          - 'nightly'
          - 'pre'
        os: [ubuntu-latest, windows-latest, macOS-latest]
        arch: [x64, aarch64]
        exclude:
          # macOS runners are ARM; the Linux and Windows ones are x64.
          - os: ubuntu-latest
            arch: aarch64
          - os: windows-latest
            arch: aarch64
          - os: macOS-latest
            arch: x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  libs:
    # The umbrella's test run reaches the lib/* packages only through itself, so their
    # dependency-weight assertions -- the single property the whole package split exists to buy
    # -- would otherwise run nowhere. Each is tested in its own environment, which is also the
    # environment a registered package is resolved in.
    #
    # Ubuntu only, deliberately: these are pure-Julia packages, the `test` job above already
    # exercises them on all three platforms through the umbrella, and what this job adds is
    # proof of isolated resolution, which does not vary by platform.
    name: lib/${{ matrix.package }} - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - LatticeSpaceGroups
          - ConnectedConfigs
          - NQSCore
          - NQSSamplers
          - NQSAnsatze
          - NQSOptimisers
        version: ['1.11', '1', 'nightly']
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: lib/${{ matrix.package }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: lib/${{ matrix.package }}
