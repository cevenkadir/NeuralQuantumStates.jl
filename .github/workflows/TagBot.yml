name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: 3
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    # One step per package that is actually registered in General. A package living in a
    # subdirectory needs `subdir`, and TagBot then names its tag `<Package>-v<version>` -- which
    # is what the `tag_prefix` in each package's `deploydocs` call expects, and therefore what
    # makes a `stable/` documentation version appear at all.
    #
    # There is deliberately no step for the umbrella: `NeuralQuantumStates` is not registered,
    # so TagBot would look for a package General does not have. Every step here runs on the same
    # `JuliaTagBot` comment, so a failure in one can take the others with it. Add a step per
    # package as each one is registered.
    steps:
      - name: ConnectedConfigs
        uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: lib/ConnectedConfigs
      - name: LatticeSpaceGroups
        uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: lib/LatticeSpaceGroups