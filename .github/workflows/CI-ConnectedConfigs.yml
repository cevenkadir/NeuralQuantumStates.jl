name: CI (ConnectedConfigs)
on:
  push:
    branches:
      - main
    tags: ['*']
    paths:
      - 'lib/ConnectedConfigs/**'
      - '.github/workflows/CI-ConnectedConfigs.yml'
      - '.github/workflows/ci-package.yml'
  pull_request:
    paths:
      - 'lib/ConnectedConfigs/**'
      - '.github/workflows/CI-ConnectedConfigs.yml'
      - '.github/workflows/ci-package.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  # A called workflow cannot hold more permission than its caller, so these have to be granted
  # here as well as in `ci-package.yml`.
  actions: write
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci-package.yml
    with:
      project: lib/ConnectedConfigs
      coverage-directories: lib/ConnectedConfigs/src
      flags: ConnectedConfigs
    secrets: inherit
