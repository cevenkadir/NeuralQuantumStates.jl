name: CI (NQSSamplers)
on:
  push:
    branches:
      - main
    tags: ['*']
    # Also triggered by its upstream lib packages (NQSCore, ConnectedConfigs): a change there
    # can break this one, and a path filter that ignored them would hide that.
    paths:
      - 'lib/NQSSamplers/**'
      - 'lib/NQSCore/**'
      - 'lib/ConnectedConfigs/**'
      - '.github/workflows/CI-NQSSamplers.yml'
      - '.github/workflows/ci-package.yml'
  pull_request:
    paths:
      - 'lib/NQSSamplers/**'
      - 'lib/NQSCore/**'
      - 'lib/ConnectedConfigs/**'
      - '.github/workflows/CI-NQSSamplers.yml'
      - '.github/workflows/ci-package.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  # A called workflow cannot hold more permission than its caller, so these have to be granted
  # here as well as in `ci-package.yml`.
  actions: write
  contents: read
jobs:
  # The job id prefixes every check this workflow reports -- `NQSSamplers / Julia ...` --
  # which is what keeps the seven workflows' checks distinguishable from each other.
  NQSSamplers:
    uses: ./.github/workflows/ci-package.yml
    with:
      project: lib/NQSSamplers
      coverage-directories: lib/NQSSamplers/src
      flags: NQSSamplers
    secrets: inherit
