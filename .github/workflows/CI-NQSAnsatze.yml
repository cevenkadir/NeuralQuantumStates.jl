name: CI (NQSAnsatze)
on:
  push:
    branches:
      - main
    tags: ['*']
    # Also triggered by its upstream lib packages (NQSCore, ConnectedConfigs, LatticeSpaceGroups): a change there
    # can break this one, and a path filter that ignored them would hide that.
    paths:
      - 'lib/NQSAnsatze/**'
      - 'lib/NQSCore/**'
      - 'lib/ConnectedConfigs/**'
      - 'lib/LatticeSpaceGroups/**'
      - '.github/workflows/CI-NQSAnsatze.yml'
      - '.github/workflows/ci-package.yml'
  pull_request:
    paths:
      - 'lib/NQSAnsatze/**'
      - 'lib/NQSCore/**'
      - 'lib/ConnectedConfigs/**'
      - 'lib/LatticeSpaceGroups/**'
      - '.github/workflows/CI-NQSAnsatze.yml'
      - '.github/workflows/ci-package.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  # A called workflow cannot hold more permission than its caller, so these have to be granted
  # here as well as in `ci-package.yml`.
  actions: write
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci-package.yml
    with:
      project: lib/NQSAnsatze
      # This package has extensions, so `ext` carries real code and belongs in the coverage.
      coverage-directories: lib/NQSAnsatze/src,lib/NQSAnsatze/ext
      flags: NQSAnsatze
    secrets: inherit
