name: CI (NQSCore)
on:
  push:
    branches:
      - main
    tags: ['*']
    # Also triggered by its upstream lib packages (ConnectedConfigs): a change there
    # can break this one, and a path filter that ignored them would hide that.
    paths:
      - 'lib/NQSCore/**'
      - 'lib/ConnectedConfigs/**'
      - '.github/workflows/CI-NQSCore.yml'
      - '.github/workflows/ci-package.yml'
  pull_request:
    paths:
      - 'lib/NQSCore/**'
      - 'lib/ConnectedConfigs/**'
      - '.github/workflows/CI-NQSCore.yml'
      - '.github/workflows/ci-package.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  # A called workflow cannot hold more permission than its caller, so these have to be granted
  # here as well as in `ci-package.yml`.
  actions: write
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci-package.yml
    with:
      project: lib/NQSCore
      coverage-directories: lib/NQSCore/src
      flags: NQSCore
    secrets: inherit
