name: CI (LatticeSpaceGroups)
on:
  push:
    branches:
      - main
    tags: ['*']
    paths:
      - 'lib/LatticeSpaceGroups/**'
      - '.github/workflows/CI-LatticeSpaceGroups.yml'
  pull_request:
    paths:
      - 'lib/LatticeSpaceGroups/**'
      - '.github/workflows/CI-LatticeSpaceGroups.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          # 1.11 is this package's declared compat floor.
          - '1.11'
          - '1'
          - 'nightly'
      # This package is registered in General, so its badge is what external users read and
      # its own workflow tests every platform they can install it on.
        os: [ubuntu-latest, windows-latest, macOS-latest]
        arch: [x64, aarch64]
        exclude:
          # macOS runners are ARM; the Linux and Windows ones are x64.
          - os: ubuntu-latest
            arch: aarch64
          - os: windows-latest
            arch: aarch64
          - os: macOS-latest
            arch: x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: lib/LatticeSpaceGroups
      - uses: julia-actions/julia-runtest@v1
        with:
          project: lib/LatticeSpaceGroups
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: lib/LatticeSpaceGroups/src,lib/LatticeSpaceGroups/ext
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: LatticeSpaceGroups
