name: CI (LatticeSpaceGroups)
on:
  push:
    branches:
      - main
    tags: ['*']
    paths:
      - 'lib/LatticeSpaceGroups/**'
      - '.github/workflows/CI-LatticeSpaceGroups.yml'
      - '.github/workflows/ci-package.yml'
  pull_request:
    paths:
      - 'lib/LatticeSpaceGroups/**'
      - '.github/workflows/CI-LatticeSpaceGroups.yml'
      - '.github/workflows/ci-package.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  # A called workflow cannot hold more permission than its caller, so these have to be granted
  # here as well as in `ci-package.yml`.
  actions: write
  contents: read
jobs:
  # The job id prefixes every check this workflow reports -- `LatticeSpaceGroups / Julia ...` --
  # which is what keeps the seven workflows' checks distinguishable from each other.
  LatticeSpaceGroups:
    uses: ./.github/workflows/ci-package.yml
    with:
      project: lib/LatticeSpaceGroups
      # This package has extensions, so `ext` carries real code and belongs in the coverage.
      coverage-directories: lib/LatticeSpaceGroups/src,lib/LatticeSpaceGroups/ext
      flags: LatticeSpaceGroups
    secrets: inherit
