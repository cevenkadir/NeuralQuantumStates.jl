name = "NeuralQuantumStates"
uuid = "0d106a18-caf6-4288-a3af-53d8e0520c36"
authors = ["cevenkadir <9449257+cevenkadir@users.noreply.github.com>"]
version = "0.1.0-dev"

# The umbrella package: it re-exports every component under `lib/` and adds the predefined
# models, the VMC driver, callbacks, and logging.
#
# This is the one package that pulls in the whole stack, Lux included -- that is its job.
# Anyone who needs only lattice geometry or only the operator kernel should depend on
# LatticeSpaceGroups or ConnectedConfigs directly and pay for neither.

[deps]
ConnectedConfigs = "6c9fa4c4-7274-48dc-8e21-1d6a47bf7d9a"
LatticeSpaceGroups = "b58f0687-8695-4e57-9eeb-fda788602521"
NQSAnsatze = "0fa8ea8c-8554-40bd-8978-b36539e7137d"
NQSCore = "fbe4a4b0-3225-4c12-93a0-7b97ae7aa121"
NQSOptimisers = "e6f1cb06-4e28-4e31-bf31-96dd4dd6e02d"
NQSSamplers = "8197fea4-252d-4314-8d17-f953e3c380bc"
OperatorAlgebra = "49087e99-997d-48ed-8945-d57b707c274b"
Optimisers = "3bd65402-5787-11e9-1adc-39752487f4e2"
Reexport = "189a3867-3050-52da-a836-e630ba90ab69"
SymBasis = "0806812d-f945-4f84-939d-820504b53c51"

# Julia 1.11+ resolves path sources declared here, so the monorepo works without every
# developer having to `Pkg.develop` each `lib/` package by hand.
[sources]
ConnectedConfigs = {path = "lib/ConnectedConfigs"}
LatticeSpaceGroups = {path = "lib/LatticeSpaceGroups"}
NQSAnsatze = {path = "lib/NQSAnsatze"}
NQSCore = {path = "lib/NQSCore"}
NQSOptimisers = {path = "lib/NQSOptimisers"}
NQSSamplers = {path = "lib/NQSSamplers"}

[compat]
ConnectedConfigs = "0.1"
LatticeSpaceGroups = "0.1"
NQSAnsatze = "0.1"
NQSCore = "0.1"
NQSOptimisers = "0.1"
NQSSamplers = "0.1"
Optimisers = "0.4.6"
OperatorAlgebra = "0.3.3"
Reexport = "1"
SymBasis = "0.2.1"
julia = "1.11"

[extras]
DifferentiationInterface = "a0c0ee7d-e4b9-4e03-894e-1c5f64a51d63"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["DifferentiationInterface", "ForwardDiff", "LinearAlgebra", "Random", "Test"]
