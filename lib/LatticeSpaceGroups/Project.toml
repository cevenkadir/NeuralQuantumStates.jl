name = "LatticeSpaceGroups"
uuid = "b58f0687-8695-4e57-9eeb-fda788602521"
authors = ["cevenkadir <9449257+cevenkadir@users.noreply.github.com>"]
version = "0.1.0"

[deps]
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"

# These must stay WEAK: this package has to remain usable for lattice geometry and symmetry
# alone, without pulling in a graph library or the quantum-basis stack. `Pkg.develop`/`Pkg.add`
# will silently move an entry into [deps] and break the corresponding extension -- if that
# happens, move it back here rather than accepting the change.
[weakdeps]
Graphs = "86223c79-3864-5bf0-83f7-82e725a168b6"
MetaGraphsNext = "fa8bd995-216d-47f1-8a91-f3b68fbeb377"
SymBasis = "0806812d-f945-4f84-939d-820504b53c51"

[extensions]
LatticeSpaceGroupsGraphsExt = "Graphs"
LatticeSpaceGroupsMetaGraphsNextExt = ["Graphs", "MetaGraphsNext"]
LatticeSpaceGroupsSymBasisExt = "SymBasis"

[compat]
Aqua = "0.8"
Graphs = "1.13"
LinearAlgebra = "1"
MetaGraphsNext = "0.5, 0.6, 0.7"
StaticArrays = "1.9"
SymBasis = "0.2.1"
Test = "1"
julia = "1.11"

[extras]
Aqua = "4c88cf16-eb10-579e-8560-4a9242c79595"
Graphs = "86223c79-3864-5bf0-83f7-82e725a168b6"
MetaGraphsNext = "fa8bd995-216d-47f1-8a91-f3b68fbeb377"
SymBasis = "0806812d-f945-4f84-939d-820504b53c51"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Aqua", "Graphs", "MetaGraphsNext", "SymBasis", "Test"]
