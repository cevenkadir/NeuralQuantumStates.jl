# BatchSolve.jl attaches at the AbstractLinearSolver seam. It is deliberately NOT a hard
# dependency: whether its batched cuBLAS solve beats a plain CG/pinv baseline on a real S
# matrix is an open question that has to be benchmarked before it is committed to.
# The UUID is a placeholder until the package is registered; verify before enabling.
# [weakdeps]
# BatchSolve = "00000000-0000-0000-0000-000000000000"
#
# [extensions]
# NQSOptimisersBatchSolveExt = "BatchSolve"

