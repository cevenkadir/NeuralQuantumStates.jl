# Compilation is the dominant cost of a run here: six regions at 3-25 s each, against
# measurements in milliseconds. XLA can persist compiled and autotuned kernels to disk, which
# turns that into a once-per-machine cost rather than a once-per-run one.
#
# The cache directory is deliberately not set. Reactant creates a versioned one keyed on the
# XLA and Reactant_jll versions, and setting it by hand is how a stale cache from an older
# build gets loaded into a newer one. `Reactant.clear_compilation_cache!()` empties it.
[Reactant]
persistent_cache_enabled = true
persistent_kernel_cache_enabled = true
